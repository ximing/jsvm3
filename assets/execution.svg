<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="'SF Mono','Menlo','Monaco','Cascadia Code','Consolas',monospace">
  <defs>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="8" fill="#0f172a"/>
  <text x="400" y="28" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">EXECUTION EXAMPLE</text>

  <!-- Source code -->
  <rect x="20" y="46" width="240" height="160" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="140" y="68" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Source</text>
  <text x="36" y="92" fill="#a78bfa" font-size="12" font-family="'SF Mono','Menlo',monospace">function</text><text x="102" y="92" fill="#e2e8f0" font-size="12" font-family="'SF Mono','Menlo',monospace">add(a, b) {</text>
  <text x="44" y="112" fill="#f472b6" font-size="12" font-family="'SF Mono','Menlo',monospace">return</text><text x="96" y="112" fill="#e2e8f0" font-size="12" font-family="'SF Mono','Menlo',monospace">a + b;</text>
  <text x="36" y="132" fill="#e2e8f0" font-size="12" font-family="'SF Mono','Menlo',monospace">}</text>
  <text x="36" y="160" fill="#e2e8f0" font-size="12" font-family="'SF Mono','Menlo',monospace">add(1, 2);</text>

  <!-- Bytecode -->
  <rect x="280" y="46" width="240" height="160" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="68" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Generated Bytecode</text>
  <text x="296" y="92" fill="#34d399" font-size="12" font-family="'SF Mono','Menlo',monospace">0x00  STRING  "add"</text>
  <text x="296" y="112" fill="#34d399" font-size="12" font-family="'SF Mono','Menlo',monospace">0x02  PUSH    1</text>
  <text x="296" y="132" fill="#34d399" font-size="12" font-family="'SF Mono','Menlo',monospace">0x04  PUSH    2</text>
  <text x="296" y="152" fill="#34d399" font-size="12" font-family="'SF Mono','Menlo',monospace">0x06  CALL    2</text>
  <text x="296" y="172" fill="#34d399" font-size="12" font-family="'SF Mono','Menlo',monospace">0x08  RETURN</text>
  <text x="296" y="192" fill="#64748b" font-size="10" font-family="'SF Mono','Menlo',monospace">; 5 instructions, 9 bytes</text>

  <!-- VM State -->
  <rect x="540" y="46" width="240" height="160" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="660" y="68" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">VM State</text>
  <text x="556" y="92" fill="#e2e8f0" font-size="12" font-family="'SF Mono','Menlo',monospace">Fiber (depth: 2)</text>
  <text x="556" y="112" fill="#cbd5e1" font-size="12" font-family="'SF Mono','Menlo',monospace">├─ Frame: add()</text>
  <text x="556" y="132" fill="#cbd5e1" font-size="12" font-family="'SF Mono','Menlo',monospace">│  ├─ r1: 1, r2: 2</text>
  <text x="556" y="152" fill="#cbd5e1" font-size="12" font-family="'SF Mono','Menlo',monospace">│  └─ rexp: 3</text>
  <text x="556" y="172" fill="#cbd5e1" font-size="12" font-family="'SF Mono','Menlo',monospace">├─ Stack: [3]</text>
  <text x="556" y="192" fill="#cbd5e1" font-size="12" font-family="'SF Mono','Menlo',monospace">└─ Scope: {a:1, b:2}</text>
</svg>